apiVersion: v1
kind: Namespace
metadata:
  name: workload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-workload
  namespace: workload
  labels:
    app: sample-workload
spec:
  replicas: 6
  selector:
    matchLabels:
      app: sample-workload
  template:
    metadata:
      labels:
        app: sample-workload
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-workload
  namespace: workload
spec:
  selector:
    app: sample-workload
  ports:
    - port: 80
      targetPort: 80
