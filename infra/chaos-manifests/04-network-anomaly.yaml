apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-anomaly
  namespace: chaos-mesh
spec:
  action: netem
  mode: all
  selector:
    namespaces:
      - workload
    labelSelectors:
      app: sample-workload
  delay:
    latency: "200ms"
    jitter: "50ms"
    correlation: "25"
  # Ajoute aussi une perte de paquets pour renforcer le signal d'anomalie réseau
  loss:
    loss: "5"
    correlation: "25"
  duration: "15m"
