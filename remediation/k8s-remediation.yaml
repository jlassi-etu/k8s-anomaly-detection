apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: monitoring
---
# Droits limités au strict nécessaire: lire/scaler les Deployments et
# lire/supprimer les Pods, uniquement dans le namespace "workload" (pas
# d'accès au reste du cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-role
  namespace: workload
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-rolebinding
  namespace: workload
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: monitoring
roleRef:
  kind: Role
  name: remediation-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-controller
  namespace: monitoring
  labels:
    app: remediation-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-controller
  template:
    metadata:
      labels:
        app: remediation-controller
    spec:
      serviceAccountName: remediation-controller
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: remediation-controller
          image: ghcr.io/jlassi-etu/k8s-anomaly-detection/remediation-controller:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9106
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9106
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-controller
  namespace: monitoring
  labels:
    app: remediation-controller
spec:
  selector:
    app: remediation-controller
  ports:
    - port: 9106
      targetPort: 9106
      name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: remediation-controller
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: remediation-controller
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
