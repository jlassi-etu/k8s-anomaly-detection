apiVersion: v1
kind: Secret
metadata:
  name: ai-inference-smtp
  namespace: monitoring
type: Opaque
stringData:
  # Remplacez ces valeurs, puis appliquez avec:
  #   kubectl apply -f k8s-ai-inference.yaml
  # Ne committez JAMAIS ce fichier une fois les vraies valeurs renseignées
  # (ajoutez-le à .gitignore, ou utilisez `kubectl create secret` en ligne de
  # commande directement plutôt que de laisser les valeurs dans ce YAML versionné).
  SMTP_PASSWORD: "elhs njkj ccil bnct"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-exporter
  namespace: monitoring
  labels:
    app: ai-inference-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference-exporter
  template:
    metadata:
      labels:
        app: ai-inference-exporter
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ai-inference-exporter
          image: ghcr.io/jlassi-etu/k8s-anomaly-detection/ai-inference-exporter:latest
          imagePullPolicy: IfNotPresent  # image chargée localement via `kind load`, pas de registre distant
          env:
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              value: "jlassinour278@gmail.com"
            - name: EMAIL_TO
              value: "jlassinour278@gmail.com"
            - name: GRAFANA_URL
              value: "http://localhost:3000"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-inference-smtp
                  key: SMTP_PASSWORD
          ports:
            - containerPort: 9105
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9105
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9105
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference-exporter
  namespace: monitoring
  labels:
    app: ai-inference-exporter
spec:
  selector:
    app: ai-inference-exporter
  ports:
    - port: 9105
      targetPort: 9105
      name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-inference-exporter
  namespace: monitoring
  labels:
    # IMPORTANT: doit correspondre au label attendu par le serviceMonitorSelector
    # de votre Prometheus (par défaut avec kube-prometheus-stack, c'est le nom
    # du release Helm — ici "kube-prometheus", utilisé dans tout ce projet).
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: ai-inference-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
